name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: |
          for file in index.js client.js lib/*.js; do
            node --check "$file"
          done
      - name: Smoke tests
        run: node test/smoke.mjs
      - name: Protocol tests
        run: node test/protocol.mjs
